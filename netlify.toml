[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Forward /api/ai-creative-brief to the Netlify Serverless Function
[[redirects]]
  from = "/api/ai-creative-brief"
  to = "/.netlify/functions/ai-creative-brief"
  status = 200

# Single Page Application (SPA) routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
